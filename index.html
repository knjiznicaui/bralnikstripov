<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0E14">
<title>GUTTER — Bralnik stripov</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0D0E14;
  --surface:#16171F;
  --surface2:#1D1E28;
  --gutter:#000;
  --text:#F2EFE6;
  --muted:#9A99A6;
  --line:rgba(242,239,230,.12);
  --line2:rgba(242,239,230,.28);
  --red:#E4383F;
  --cyan:#29B6C4;
  --yellow:#F2B705;
  --max:1180px;
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
}

body.reader-active{
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.disp{
  font-family:Anton,sans-serif;
  font-weight:400;
}

.topnav{
  max-width:var(--max);
  margin:auto;
  padding:calc(16px + var(--safeT)) 20px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.wordmark{
  font-family:Anton,sans-serif;
  font-size:23px;
  display:flex;
  align-items:center;
  gap:8px;
}

.mark{
  display:flex;
  gap:2px;
}

.mark span{
  display:block;
  width:7px;
  height:18px;
  background:var(--red);
}

.mark span:nth-child(2){
  background:var(--cyan);
  height:14px;
  align-self:end;
}

.navbtn{
  background:none;
  border:0;
  color:var(--text);
  padding:8px;
  display:flex;
  align-items:center;
  gap:7px;
  border-radius:6px;
}

.navbtn:hover{
  background:var(--line);
}

.shell{
  max-width:var(--max);
  margin:auto;
  padding:0 20px 60px;
}

.hero{
  padding:45px 20px;
  background-image:
    radial-gradient(rgba(228,56,63,.35) 1.4px,transparent 1.6px);
  background-size:15px 15px;
}

.hero-inner{
  max-width:var(--max);
  margin:auto;
}

.hero h1{
  font-size:clamp(44px,10vw,82px);
  line-height:.95;
}

.tagline{
  max-width:520px;
  color:var(--muted);
  line-height:1.6;
}

.btn{
  border:2px solid var(--line2);
  background:var(--surface);
  color:var(--text);
  padding:12px 18px;
  border-radius:6px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn:hover{
  border-color:var(--text);
}

.btn-primary{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

.btn-primary:hover{
  background:#c72e34;
}

.cta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.section-title{
  margin:25px 0 12px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.search{
  width:100%;
  padding:13px 15px;
  background:var(--surface);
  border:2px solid var(--line);
  color:var(--text);
  border-radius:6px;
  margin-bottom:15px;
}

.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:20px;
}

.chip{
  white-space:nowrap;
  border:2px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  border-radius:100px;
  padding:7px 13px;
}

.chip.active{
  border-color:var(--red);
  color:var(--red);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px;
  padding:3px;
  background:#000;
  border-radius:6px;
}

@media(min-width:620px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(min-width:920px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

.card{
  background:var(--surface);
  min-width:0;
}

.thumb{
  position:relative;
  aspect-ratio:3/4;
  background:#000;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.badge{
  position:absolute;
  top:8px;
  left:8px;
  padding:4px 8px;
  border-radius:20px;
  background:rgba(0,0,0,.8);
  color:#fff;
  font-size:11px;
  font-weight:700;
}

.cardbody{
  padding:12px;
}

.cardtitle{
  font-size:15px;
  font-weight:700;
}

.cardtags{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.read{
  width:100%;
  margin-top:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:60px 20px;
}

/* ================= READER ================= */

#reader{
  position:fixed;
  inset:0;
  z-index:999;
  background:#000;
}

.reader-stage{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  touch-action:none;
  user-select:none;
}

.reader-frame{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#000;
}

.reader-img{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  transform-origin:center;
  transition:transform .15s ease;
}

.reader-img.zoomed{
  transform:scale(2.2);
}

.reader-top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:5;
  padding:calc(12px + var(--safeT)) 15px 18px;
  background:linear-gradient(#000b,transparent);
  transition:.2s;
}

.reader-top.hidden-ui,
.reader-bottom.hidden-ui{
  opacity:0;
  pointer-events:none;
}

.reader-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.reader-row button{
  background:none;
  border:0;
  color:white;
  padding:7px;
}

.reader-title{
  flex:1;
  min-width:0;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.counter{
  color:#bbb;
  font-size:12px;
}

.progress{
  height:3px;
  margin-top:8px;
  background:#333;
}

.progress i{
  display:block;
  height:100%;
  background:var(--red);
}

.reader-bottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  z-index:5;
  padding:20px 20px calc(15px + var(--safeB));
  display:flex;
  justify-content:center;
  background:linear-gradient(transparent,#000c);
  transition:.2s;
}

.menu{
  border:1px solid #555;
  background:#222c;
  color:#fff;
  border-radius:100px;
  padding:10px 22px;
  font-weight:700;
}

.dots{
  position:absolute;
  z-index:5;
  bottom:65px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:5px;
}

.dot{
  width:5px;
  height:5px;
  background:#777;
  border-radius:20px;
}

.dot.active{
  width:15px;
  background:#fff;
}

.sheet-overlay{
  position:absolute;
  inset:0;
  z-index:6;
  background:#0009;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.sheet-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.sheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:7;
  background:var(--surface);
  padding:12px 20px calc(20px + var(--safeB));
  border-radius:18px 18px 0 0;
  transform:translateY(100%);
  transition:.25s;
  max-height:75vh;
  overflow:auto;
}

.sheet.open{
  transform:translateY(0);
}

.handle{
  width:38px;
  height:4px;
  background:#777;
  margin:5px auto 20px;
  border-radius:10px;
}

.sheet h4{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  margin:18px 0 9px;
}

.sheet button{
  border:2px solid var(--line);
  background:none;
  color:var(--text);
  padding:10px 14px;
  border-radius:7px;
  font-weight:700;
}

.sheet button.active{
  border-color:var(--red);
  color:var(--red);
}

.format-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
}

@media(orientation:landscape){
  .reader-frame.landscape{
    width:100vw!important;
    height:100vh!important;
  }
}

@media(orientation:portrait){
  .reader-frame.portrait{
    width:100vw!important;
    height:100vh!important;
  }
}

/*
  Pri ležečih stripih želimo izkoristiti širino.
*/
.reader-frame.landscape .reader-img{
  max-width:100vw;
  max-height:100vh;
  width:auto;
  height:auto;
}

/*
  Pri pokončnih stripih želimo izkoristiti višino.
*/
.reader-frame.portrait .reader-img{
  max-width:100vw;
  max-height:100vh;
  width:auto;
  height:auto;
}

@media(max-width:600px){
  .hero{
    padding-top:30px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

/* =========================================================
   GUTTER PUBLIC READER
   ========================================================= */

const REPO_OWNER = "TVOJ_GITHUB_UPORABNIK";
const REPO_NAME  = "TVOJ_REPOZITORIJ";
const BRANCH     = "main";
const COMICS_URL =
  "https://raw.githubusercontent.com/" +
  REPO_OWNER + "/" +
  REPO_NAME + "/" +
  BRANCH + "/comics.json";

const FORMATS = {
  auto:{
    label:"Samodejno",
    ratio:null
  },
  vertical:{
    label:"9:16",
    ratio:9/16
  },
  portrait:{
    label:"3:4",
    ratio:3/4
  },
  square:{
    label:"1:1",
    ratio:1
  },
  landscape:{
    label:"16:9",
    ratio:16/9
  }
};

let comics=[];
let currentComic=null;
let currentIndex=0;
let currentFormat="auto";
let currentDirection="ltr";
let readerVisible=true;
let zoomed=false;

const app=document.getElementById("app");

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function icon(name,size=20){
  const icons={
    back:`<path d="M15 18l-6-6 6-6"/>`,
    close:`<path d="M18 6L6 18M6 6l12 12"/>`,
    book:`<path d="M4 5a2 2 0 012-2h5v18H6a2 2 0 01-2-2z"/><path d="M20 5a2 2 0 00-2-2h-5v18h5a2 2 0 002-2z"/>`,
    settings:`<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 01-.2 1.6l2 1.5-2 3.4-2.3-1a7 7 0 01-2.6 1.5L13.5 21h-3l-.4-2a7 7 0 01-2.6-1.5l-2.3 1-2-3.4 2-1.5A7 7 0 015 12a7 7 0 01.2-1.6l-2-1.5 2-3.4 2.3 1a7 7 0 012.6-1.5l.4-2h3l.4 2a7 7 0 012.6 1.5l2.3-1 2 3.4-2 1.5A7 7 0 0119 12z"/>`,
    menu:`<path d="M4 7h16M4 12h16M4 17h16"/>`,
    arrow:`<path d="M5 12h14M13 6l6 6-6 6"/>`
  };

  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    ${icons[name]||""}
  </svg>`;
}

/* ================= DATA ================= */

async function loadComics(){
  try{
    const response=await fetch(COMICS_URL+"?v="+Date.now(),{
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("Knjižnice ni mogoče naložiti.");
    }

    comics=await response.json();

    if(!Array.isArray(comics)){
      comics=[];
    }

  }catch(error){
    console.error(error);
    comics=[];
  }
}

/* ================= HOME ================= */

function renderHome(){

  app.innerHTML=`
    <div class="topnav">
      <div class="wordmark">
        <span class="mark"><span></span><span></span></span>
        GUTTER
      </div>

      <a class="navbtn"
         href="admin.html"
         title="Administrator">
         ${icon("settings",22)}
      </a>
    </div>

    <section class="hero">
      <div class="hero-inner">

        <h1 class="disp">
          Berite stripe.<br>
          Panel za panelom.
        </h1>

        <p class="tagline">
          GUTTER je celozaslonski bralnik stripov.
          Ležeči stripi se prilagodijo ležečemu zaslonu,
          pokončni pa pokončnemu.
        </p>

        <div class="cta">
          <button class="btn btn-primary"
                  onclick="showLibrary()">
            ${icon("book",18)}
            Odpri knjižnico
          </button>
        </div>

      </div>
    </section>
  `;
}

/* ================= LIBRARY ================= */

function showLibrary(){

  const tags=[
    ...new Set(
      comics.flatMap(c=>Array.isArray(c.tags)?c.tags:[])
    )
  ];

  app.innerHTML=`
    <div class="topnav">
      <button class="navbtn"
              onclick="renderHome()">
        ${icon("back",22)}
        Domov
      </button>

      <a class="navbtn"
         href="admin.html">
        ${icon("settings",22)}
      </a>
    </div>

    <main class="shell">

      <h2 class="disp" style="font-size:36px;margin-bottom:20px">
        Knjižnica
      </h2>

      <input
        class="search"
        id="search"
        type="search"
        placeholder="Išči stripe..."
        oninput="filterLibrary()">

      <div class="chips">
        <button class="chip active"
                onclick="filterTag(null,this)">
          Vse
        </button>

        ${tags.map(tag=>`
          <button class="chip"
                  onclick="filterTag('${esc(tag)}',this)">
            ${esc(tag)}
          </button>
        `).join("")}
      </div>

      <div id="comic-grid"></div>

    </main>
  `;

  drawLibrary(comics);
}

let selectedTag=null;

function filterTag(tag,button){

  selectedTag=tag;

  document.querySelectorAll(".chip")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  filterLibrary();
}

function filterLibrary(){

  const query=
    (document.getElementById("search")?.value||"")
      .toLowerCase();

  let list=comics.filter(c=>{

    const title=(c.title||"").toLowerCase();

    const tags=(c.tags||[])
      .join(" ")
      .toLowerCase();

    const text=title+" "+tags;

    const matchesSearch=
      !query || text.includes(query);

    const matchesTag=
      !selectedTag ||
      (c.tags||[]).includes(selectedTag);

    return matchesSearch && matchesTag;
  });

  drawLibrary(list);
}

function drawLibrary(list){

  const grid=document.getElementById("comic-grid");

  if(!grid) return;

  if(!list.length){

    grid.innerHTML=`
      <div class="empty">
        <h3>Knjižnica je prazna</h3>
        <p>Administrator še ni dodal stripov.</p>
      </div>
    `;

    return;
  }

  grid.innerHTML=`
    <div class="grid">

      ${list.map(comic=>{

        const format=
          FORMATS[comic.format]||FORMATS.auto;

        return `
          <article class="card">

            <div class="thumb">

              <img
                src="${esc(comic.panels?.[0]||"")}"
                alt="${esc(comic.title)}"
                loading="lazy">

              <span class="badge">
                ${esc(format.label)}
              </span>

            </div>

            <div class="cardbody">

              <div class="cardtitle">
                ${esc(comic.title)}
              </div>

              ${
                comic.tags?.length
                ? `<div class="cardtags">
                    ${comic.tags.map(esc).join(" · ")}
                   </div>`
                :""
              }

              <button
                class="btn btn-primary read"
                onclick="openReader('${esc(comic.id)}')">

                ${icon("arrow",16)}
                Beri strip

              </button>

            </div>

          </article>
        `;

      }).join("")}

    </div>
  `;
}

/* ================= READER ================= */

function getComic(id){
  return comics.find(c=>c.id===id);
}

async function openReader(id,start=0){

  currentComic=getComic(id);

  if(!currentComic) return;

  currentIndex=Math.min(
    start,
    currentComic.panels.length-1
  );

  currentFormat=currentComic.format||"auto";
  currentDirection=currentComic.direction||"ltr";
  zoomed=false;
  readerVisible=true;

  document.body.classList.add("reader-active");

  renderReader();

  /*
    Poskusimo samodejno zakleniti orientacijo.
    Brskalniki tega ne dovolijo vedno, zato je
    bralnik narejen tako, da pravilno deluje tudi
    brez zaklepanja orientacije.
  */
  await requestOrientation();
}

async function requestOrientation(){

  let orientation=null;

  if(currentFormat==="landscape"){
    orientation="landscape";
  }

  if(
    currentFormat==="portrait" ||
    currentFormat==="vertical"
  ){
    orientation="portrait";
  }

  /*
    Pri AUTO določimo orientacijo iz same slike.
  */
  if(currentFormat==="auto"){

    const img=new Image();

    img.onload=async()=>{

      orientation=
        img.naturalWidth > img.naturalHeight
        ? "landscape"
        : "portrait";

      await lockOrientation(orientation);
      resizeReader();
    };

    img.src=currentComic.panels[currentIndex];

    return;
  }

  await lockOrientation(orientation);
  resizeReader();
}

async function lockOrientation(orientation){

  if(!orientation) return;

  try{

    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      await screen.orientation.lock(orientation);

    }

  }catch(error){

    /*
      iPhone/Safari in nekateri brskalniki
      zaklepanja orientacije ne dovolijo.
      To ni napaka aplikacije.
    */

    console.log(
      "Samodejno zaklepanje orientacije ni podprto.",
      error
    );
  }
}

function unlockOrientation(){

  try{

    if(
      screen.orientation &&
      screen.orientation.unlock
    ){
      screen.orientation.unlock();
    }

  }catch(e){}
}

function renderReader(){

  const comic=currentComic;

  const format=
    FORMATS[comic.format]||FORMATS.auto;

  const orientationClass=
    comic.format==="landscape"
    ? "landscape"
    : "portrait";

  app.innerHTML=`

    <div id="reader">

      <div
        class="reader-stage"
        id="reader-stage">

        <div
          class="reader-frame ${orientationClass}"
          id="reader-frame">

          <img
            id="reader-img"
            class="reader-img"
            src="${esc(comic.panels[currentIndex])}"
            alt="${esc(comic.title)}">

        </div>

      </div>

      <div
        class="reader-top"
        id="reader-top">

        <div class="reader-row">

          <button onclick="closeReader()">
            ${icon("close",22)}
          </button>

          <div class="reader-title">
            ${esc(comic.title)}
          </div>

          <div class="counter"
               id="counter">
            ${currentIndex+1} / ${comic.panels.length}
          </div>

        </div>

        <div class="progress">
          <i id="reader-progress"
             style="width:${((currentIndex+1)/comic.panels.length)*100}%">
          </i>
        </div>

      </div>

      <div
        class="reader-bottom"
        id="reader-bottom">

        <button
          class="menu"
          onclick="toggleSheet()">

          ${icon("menu",16)}
          Meni

        </button>

      </div>

      ${
        comic.panels.length<=20
        ? `
          <div class="dots">
            ${comic.panels.map((_,i)=>`
              <span class="dot ${i===currentIndex?"active":""}">
              </span>
            `).join("")}
          </div>
        `
        :""
      }

      <div
        class="sheet-overlay"
        id="sheet-overlay"
        onclick="closeSheet()">
      </div>

      <div
        class="sheet"
        id="sheet">

        <div class="handle"></div>

        <h4>Format</h4>

        <div class="format-row">

          ${Object.keys(FORMATS).map(key=>`

            <button
              class="${comic.format===key?"active":""}"
              onclick="changeFormat('${key}')">

              ${FORMATS[key].label}

            </button>

          `).join("")}

        </div>

        <h4>Smer branja</h4>

        <div class="format-row">

          <button
            class="${currentDirection==="ltr"?"active":""}"
            onclick="changeDirection('ltr')">
            Zahodna →
          </button>

          <button
            class="${currentDirection==="rtl"?"active":""}"
            onclick="changeDirection('rtl')">
            ← Manga
          </button>

        </div>

        <button
          class="btn"
          style="width:100%;margin-top:20px"
          onclick="closeReader()">

          Zapri bralnik

        </button>

      </div>

    </div>
  `;

  resizeReader();

  setupReaderTouch();

  preload();
}

function resizeReader(){

  const frame=document.getElementById("reader-frame");

  if(!frame) return;

  const format=
    FORMATS[currentComic.format]||FORMATS.auto;

  /*
    AUTO uporablja dejansko razmerje slike.
    Za prikaz ne omejujemo slike na napačno
    pokončno/ležeče razmerje.
  */

  if(format.ratio){

    const vw=window.innerWidth;
    const vh=window.innerHeight;

    let width=vw;
    let height=width/format.ratio;

    if(height>vh){

      height=vh;
      width=height*format.ratio;

    }

    frame.style.width=width+"px";
    frame.style.height=height+"px";

  }else{

    frame.style.width="100vw";
    frame.style.height="100vh";

  }
}

function preload(){

  [-1,1].forEach(offset=>{

    const index=currentIndex+offset;

    if(
      index>=0 &&
      index<currentComic.panels.length
    ){

      const img=new Image();

      img.src=currentComic.panels[index];
    }

  });
}

function nextPanel(){

  if(
    currentIndex <
    currentComic.panels.length-1
  ){

    currentIndex++;

    updateReaderImage();

  }

}

function previousPanel(){

  if(currentIndex>0){

    currentIndex--;

    updateReaderImage();

  }

}

function updateReaderImage(){

  const img=document.getElementById("reader-img");

  if(!img) return;

  img.src=currentComic.panels[currentIndex];

  document.getElementById("counter")
    .textContent=
      `${currentIndex+1} / ${currentComic.panels.length}`;

  document.getElementById("reader-progress")
    .style.width=
      `${((currentIndex+1)/currentComic.panels.length)*100}%`;

  document.querySelectorAll(".dot")
    .forEach((dot,i)=>{
      dot.classList.toggle(
        "active",
        i===currentIndex
      );
    });

  resetZoom();

  preload();

  /*
    AUTO mora ponovno preveriti orientacijo
    pri vsakem novem panelu.
  */
  if(currentComic.format==="auto"){
    requestOrientation();
  }
}

function handleSwipe(dx){

  const forward=
    currentDirection==="ltr"
    ? dx<0
    : dx>0;

  if(forward){
    nextPanel();
  }else{
    previousPanel();
  }
}

function setupReaderTouch(){

  const stage=
    document.getElementById("reader-stage");

  if(!stage) return;

  let startX=0;
  let startY=0;
  let startTime=0;

  stage.addEventListener(
    "pointerdown",
    e=>{

      startX=e.clientX;
      startY=e.clientY;
      startTime=Date.now();

    }
  );

  stage.addEventListener(
    "pointerup",
    e=>{

      const dx=e.clientX-startX;
      const dy=e.clientY-startY;
      const duration=Date.now()-startTime;

      /*
        ŠVIG
      */
      if(
        Math.abs(dx)>50 &&
        Math.abs(dx)>Math.abs(dy)*1.2 &&
        duration<800 &&
        !zoomed
      ){

        handleSwipe(dx);
        return;
      }

      /*
        TAP
      */
      if(
        Math.abs(dx)<15 &&
        Math.abs(dy)<15 &&
        duration<500
      ){

        toggleReaderUI();

      }

    }
  );

  /*
    Dvoklik = zoom.
  */
  let lastTap=0;

  stage.addEventListener(
    "dblclick",
    e=>{

      const img=
        document.getElementById("reader-img");

      if(!img) return;

      zoomed=!zoomed;

      if(zoomed){

        const rect=img.getBoundingClientRect();

        const x=
          ((e.clientX-rect.left)/rect.width)*100;

        const y=
          ((e.clientY-rect.top)/rect.height)*100;

        img.style.transformOrigin=
          `${x}% ${y}%`;

        img.classList.add("zoomed");

      }else{

        resetZoom();

      }

    }
  );
}

function resetZoom(){

  zoomed=false;

  const img=
    document.getElementById("reader-img");

  if(img){

    img.classList.remove("zoomed");
    img.style.transform="";
    img.style.transformOrigin="";

  }
}

function toggleReaderUI(){

  readerVisible=!readerVisible;

  document
    .getElementById("reader-top")
    ?.classList.toggle(
      "hidden-ui",
      !readerVisible
    );

  document
    .getElementById("reader-bottom")
    ?.classList.toggle(
      "hidden-ui",
      !readerVisible
    );

}

function toggleSheet(){

  document
    .getElementById("sheet")
    ?.classList.toggle("open");

  document
    .getElementById("sheet-overlay")
    ?.classList.toggle("open");

}

function closeSheet(){

  document
    .getElementById("sheet")
    ?.classList.remove("open");

  document
    .getElementById("sheet-overlay")
    ?.classList.remove("open");

}

function changeFormat(format){

  currentComic.format=format;

  closeSheet();

  renderReader();

  requestOrientation();

}

function changeDirection(direction){

  currentDirection=direction;

  currentComic.direction=direction;

  closeSheet();

}

async function closeReader(){

  unlockOrientation();

  document.body.classList.remove("reader-active");

  currentComic=null;

  renderHome();

}

/* ================= KEYBOARD ================= */

document.addEventListener("keydown",e=>{

  if(!currentComic) return;

  if(e.key==="ArrowRight"){

    currentDirection==="ltr"
      ? nextPanel()
      : previousPanel();

  }

  if(e.key==="ArrowLeft"){

    currentDirection==="ltr"
      ? previousPanel()
      : nextPanel();

  }

  if(e.key==="Escape"){

    closeReader();

  }

});

/* ================= RESIZE ================= */

window.addEventListener(
  "resize",
  ()=>{
    if(currentComic){
      resizeReader();
    }
  }
);

window.addEventListener(
  "orientationchange",
  ()=>{
    setTimeout(()=>{
      if(currentComic){
        resizeReader();
      }
    },150);
  }
);

/* ================= START ================= */

async function start(){

  renderHome();

  await loadComics();

}

start();

</script>
