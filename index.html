<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0E14">
<title>Radovedni — Bralnik stripov</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0D0E14;
  --surface:#16171F;
  --surface2:#1D1E28;
  --gutter:#000;
  --text:#F2EFE6;
  --muted:#9A99A6;
  --line:rgba(242,239,230,.12);
  --line2:rgba(242,239,230,.28);
  --red:#E4383F;
  --cyan:#29B6C4;
  --yellow:#F2B705;
  --max:1180px;
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
}

body.reader-active{
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.disp{
  font-family:Anton,sans-serif;
  font-weight:400;
}

.topnav{
  max-width:var(--max);
  margin:auto;
  padding:calc(16px + var(--safeT)) 20px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.wordmark{
  font-family:Anton,sans-serif;
  font-size:23px;
  display:flex;
  align-items:center;
  gap:8px;
}

.mark{
  display:flex;
  gap:2px;
}

.mark span{
  display:block;
  width:7px;
  height:18px;
  background:var(--red);
}

.mark span:nth-child(2){
  background:var(--cyan);
  height:14px;
  align-self:end;
}

.navbtn{
  background:none;
  border:0;
  color:var(--text);
  padding:8px;
  display:flex;
  align-items:center;
  gap:7px;
  border-radius:6px;
}

.navbtn:hover{
  background:var(--line);
}

.shell{
  max-width:var(--max);
  margin:auto;
  padding:0 20px 60px;
}

.hero{
  padding:45px 20px;
  background-image:
    radial-gradient(rgba(228,56,63,.35) 1.4px,transparent 1.6px);
  background-size:15px 15px;
}

.hero-inner{
  max-width:var(--max);
  margin:auto;
}

.hero h1{
  font-size:clamp(44px,10vw,82px);
  line-height:.95;
}

.tagline{
  max-width:520px;
  color:var(--muted);
  line-height:1.6;
}

.btn{
  border:2px solid var(--line2);
  background:var(--surface);
  color:var(--text);
  padding:12px 18px;
  border-radius:6px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn:hover{
  border-color:var(--text);
}

.btn-primary{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

.btn-primary:hover{
  background:#c72e34;
}

.cta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.search{
  width:100%;
  padding:13px 15px;
  background:var(--surface);
  border:2px solid var(--line);
  color:var(--text);
  border-radius:6px;
  margin-bottom:15px;
}

.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:20px;
}

.chip{
  white-space:nowrap;
  border:2px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  border-radius:100px;
  padding:7px 13px;
}

.chip.active{
  border-color:var(--red);
  color:var(--red);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px;
  padding:3px;
  background:#000;
  border-radius:6px;
}

@media(min-width:620px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(min-width:920px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

.card{
  background:var(--surface);
  min-width:0;
}

.thumb{
  position:relative;
  aspect-ratio:3/4;
  background:#000;
  overflow:hidden;
  cursor:pointer;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  cursor:pointer;
  transition:transform .2s ease;
}

.thumb:hover img{
  transform:scale(1.02);
}

.badge{
  position:absolute;
  top:8px;
  left:8px;
  padding:4px 8px;
  border-radius:20px;
  background:rgba(0,0,0,.8);
  color:#fff;
  font-size:11px;
  font-weight:700;
  pointer-events:none;
}

.cardbody{
  padding:12px;
}

.cardtitle{
  font-size:15px;
  font-weight:700;
}

.cardtags{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.read{
  width:100%;
  margin-top:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:60px 20px;
}

/* ================= READER ================= */

#reader{
  position:fixed;
  inset:0;
  z-index:999;
  background:#000;
}

/*
  Bralni prostor se začne pod zgornjim menijem,
  zato slika ne leži pod rdečo progress črto.
*/
.reader-stage{
  position:absolute;
  top:72px;
  left:0;
  right:0;
  bottom:0;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
  touch-action:none;
  user-select:none;

  z-index:1;
}

.reader-frame{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#000;

  max-width:100%;
  max-height:100%;
}

.reader-img{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:100%;
  object-fit:contain;

  transform-origin:center;
  transition:transform .08s linear;

  user-select:none;
  -webkit-user-drag:none;
}

.reader-img.zoomed{
  transform:scale(2.2);
}

/* ZGORNJI MENI */

.reader-top{
  position:absolute;
  top:0;
  left:0;
  right:0;

  z-index:20;

  padding:calc(12px + var(--safeT)) 15px 18px;

  background:linear-gradient(#000b,transparent);

  transition:.2s;

  pointer-events:auto;
}

.reader-top.hidden-ui{
  opacity:0;
  pointer-events:none;
}

.reader-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.reader-row button{
  background:rgba(0,0,0,.35);
  border:0;
  color:white;

  padding:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  pointer-events:auto;

  position:relative;
  z-index:30;
}

.reader-row button:hover{
  background:rgba(255,255,255,.15);
}

.reader-title{
  flex:1;
  min-width:0;

  font-size:14px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.counter{
  color:#bbb;
  font-size:12px;
}

.progress{
  height:3px;
  margin-top:8px;
  background:#333;
}

.progress i{
  display:block;
  height:100%;
  background:var(--red);
}

.dots{
  position:absolute;
  z-index:5;

  bottom:20px;
  left:0;
  right:0;

  display:flex;
  justify-content:center;
  gap:5px;

  pointer-events:none;
}

.dot{
  width:5px;
  height:5px;
  background:#777;
  border-radius:20px;
}

.dot.active{
  width:15px;
  background:#fff;
}

@media(orientation:landscape){
  .reader-frame.landscape{
    width:100%!important;
    height:100%!important;
  }
}

@media(orientation:portrait){
  .reader-frame.portrait{
    width:100%!important;
    height:100%!important;
  }
}

.reader-frame.landscape .reader-img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
}

.reader-frame.portrait .reader-img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
}

/*
  Med srednjim klikom miške pokažemo, da je uporabnik
  v načinu za zoom.
*/
#reader.zoom-dragging{
  cursor:ew-resize;
}

#reader.zoom-dragging .reader-img{
  cursor:ew-resize;
}

@media(max-width:600px){

  .hero{
    padding-top:30px;
  }

  .reader-stage{
    top:66px;
  }

}

</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

/* =========================================================
   GUTTER PUBLIC READER
   ========================================================= */

const REPO_OWNER = "knjiznicaui";
const REPO_NAME  = "bralnikstripov";
const BRANCH     = "main";

const COMICS_URL =
  "https://raw.githubusercontent.com/" +
  REPO_OWNER + "/" +
  REPO_NAME + "/" +
  BRANCH + "/comics.json";

const FORMATS = {
  auto:{
    label:"Samodejno",
    ratio:null
  },
  vertical:{
    label:"9:16",
    ratio:9/16
  },
  portrait:{
    label:"3:4",
    ratio:3/4
  },
  square:{
    label:"1:1",
    ratio:1
  },
  landscape:{
    label:"16:9",
    ratio:16/9
  }
};

let comics=[];
let currentComic=null;
let currentIndex=0;
let currentFormat="auto";
let currentDirection="ltr";
let readerVisible=true;
let zoomed=false;

/* ================= MOUSE WHEEL ================= */

let wheelLocked=false;

/* ================= MIDDLE MOUSE ZOOM ================= */

let middleMouseDown=false;
let middleStartX=0;
let middleStartZoom=1;

const MIN_ZOOM=1;
const MAX_ZOOM=4;

const app=document.getElementById("app");

/* ================= HELPERS ================= */

function esc(value){

  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]||c));

}

function icon(name,size=20){

  const icons={

    back:`<path d="M15 18l-6-6 6-6"/>`,

    close:`<path d="M18 6L6 18M6 6l12 12"/>`,

    book:`<path d="M4 5a2 2 0 012-2h5v18H6a2 2 0 01-2-2z"/><path d="M20 5a2 2 0 00-2-2h-5v18h5a2 2 0 002-2z"/>`,

    settings:`<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 01-.2 1.6l2 1.5-2 3.4-2.3-1a7 7 0 01-2.6 1.5L13.5 21h-3l-.4-2a7 7 0 01-2.6-1.5l-2.3 1-2.3-1 2-3.4-2-1.5A7 7 0 015 12a7 7 0 01.2-1.6l-2-1.5 2-3.4 2.3 1a7 7 0 012.6-1.5l.4-2h3l.4 2a7 7 0 012.6 1.5l2.3-1 2 3.4-2 1.5A7 7 0 0119 12z"/>`,

    arrow:`<path d="M5 12h14M13 6l6 6-6 6"/>`

  };

  return `
    <svg
      width="${size}"
      height="${size}"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">

      ${icons[name]||""}

    </svg>
  `;

}

/* ================= DATA ================= */

async function loadComics(){

  try{

    const response=await fetch(
      COMICS_URL+"?v="+Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!response.ok){

      throw new Error(
        "Knjižnice ni mogoče naložiti."
      );

    }

    comics=await response.json();

    if(!Array.isArray(comics)){
      comics=[];
    }

  }catch(error){

    console.error(error);

    comics=[];

  }

}

/* ================= HOME ================= */

function renderHome(){

  app.innerHTML=`

    <div class="topnav">

      <div class="wordmark">

        <span class="mark">
          <span></span>
          <span></span>
        </span>

        Radovedni

      </div>

      <a
        class="navbtn"
        href="admin.html"
        title="Administrator">

        ${icon("settings",22)}

      </a>

    </div>

    <section class="hero">

      <div class="hero-inner">

        <h1 class="disp">
          Berite stripe.<br>
          Panel za panelom.
        </h1>

        <p class="tagline">
          Celozaslonski bralnik stripov.
          Ležeči stripi se prilagodijo ležečemu zaslonu,
          pokončni pa pokončnemu.
        </p>

        <div class="cta">

          <button
            class="btn btn-primary"
            onclick="showLibrary()">

            ${icon("book",18)}

            Odpri knjižnico

          </button>

        </div>

      </div>

    </section>

  `;

}

/* ================= LIBRARY ================= */

function showLibrary(){

  const tags=[
    ...new Set(
      comics.flatMap(
        c=>Array.isArray(c.tags)?c.tags:[]
      )
    )
  ];

  app.innerHTML=`

    <div class="topnav">

      <button
        class="navbtn"
        onclick="renderHome()">

        ${icon("back",22)}

        Domov

      </button>

      <a
        class="navbtn"
        href="admin.html">

        ${icon("settings",22)}

      </a>

    </div>

    <main class="shell">

      <h2
        class="disp"
        style="font-size:36px;margin-bottom:20px">

        Knjižnica

      </h2>

      <input
        class="search"
        id="search"
        type="search"
        placeholder="Išči stripe..."
      >

      <div class="chips">

        <button
          class="chip active"
          onclick="filterTag(null,this)">

          Vse

        </button>

        ${tags.map(tag=>`

          <button
            class="chip"
            onclick="filterTag('${esc(tag)}',this)">

            ${esc(tag)}

          </button>

        `).join("")}

      </div>

      <div id="comic-grid"></div>

    </main>

  `;

  const search=document.getElementById("search");

  if(search){

    search.addEventListener(
      "input",
      filterLibrary
    );

  }

  drawLibrary(comics);

}

let selectedTag=null;

function filterTag(tag,button){

  selectedTag=tag;

  document
    .querySelectorAll(".chip")
    .forEach(
      x=>x.classList.remove("active")
    );

  button.classList.add("active");

  filterLibrary();

}

function filterLibrary(){

  const query=
    (
      document
        .getElementById("search")
        ?.value||""
    ).toLowerCase();

  let list=comics.filter(c=>{

    const title=
      (c.title||"").toLowerCase();

    const tags=
      (c.tags||[])
        .join(" ")
        .toLowerCase();

    const text=
      title+" "+tags;

    const matchesSearch=
      !query ||
      text.includes(query);

    const matchesTag=
      !selectedTag ||
      (c.tags||[]).includes(
        selectedTag
      );

    return matchesSearch && matchesTag;

  });

  drawLibrary(list);

}

function drawLibrary(list){

  const grid=
    document.getElementById(
      "comic-grid"
    );

  if(!grid) return;

  if(!list.length){

    grid.innerHTML=`

      <div class="empty">

        <h3>Knjižnica je prazna</h3>

        <p>
          Administrator še ni dodal stripov.
        </p>

      </div>

    `;

    return;

  }

  grid.innerHTML=`

    <div class="grid">

      ${list.map(comic=>{

        return `

          <article class="card">

            <div
              class="thumb"
              onclick="openReader('${esc(comic.id)}')"
              role="button"
              tabindex="0"
              aria-label="Odpri strip ${esc(comic.title)}"
              onkeydown="
                if(
                  event.key==='Enter' ||
                  event.key===' '
                ){
                  openReader('${esc(comic.id)}')
                }
              ">

              <img
                src="${esc(comic.panels?.[0]||"")}"
                alt="${esc(comic.title)}"
                loading="lazy">

            </div>

            <div class="cardbody">

              <div class="cardtitle">

                ${esc(comic.title)}

              </div>

              ${
                comic.tags?.length
                ? `
                  <div class="cardtags">
                    ${comic.tags.map(esc).join(" · ")}
                  </div>
                `
                :""
              }

              <button
                class="btn btn-primary read"
                onclick="openReader('${esc(comic.id)}')">

                ${icon("arrow",16)}

                Beri strip

              </button>

            </div>

          </article>

        `;

      }).join("")}

    </div>

  `;

}

/* ================= READER ================= */

function getComic(id){

  return comics.find(
    c=>c.id===id
  );

}

async function openReader(id,start=0){

  currentComic=getComic(id);

  if(!currentComic) return;

  currentIndex=Math.min(
    start,
    currentComic.panels.length-1
  );

  currentFormat=
    currentComic.format||"auto";

  currentDirection=
    currentComic.direction||"ltr";

  zoomed=false;

  readerVisible=true;

  wheelLocked=false;

  middleMouseDown=false;

  middleStartZoom=1;

  document.body.classList.add(
    "reader-active"
  );

  renderReader();

  await requestOrientation();

}

async function requestOrientation(){

  let orientation=null;

  if(currentFormat==="landscape"){

    orientation="landscape";

  }

  if(
    currentFormat==="portrait" ||
    currentFormat==="vertical"
  ){

    orientation="portrait";

  }

  if(currentFormat==="auto"){

    const img=new Image();

    img.onload=async()=>{

      orientation=
        img.naturalWidth >
        img.naturalHeight
        ? "landscape"
        : "portrait";

      await lockOrientation(
        orientation
      );

      resizeReader();

    };

    img.src=
      currentComic.panels[
        currentIndex
      ];

    return;

  }

  await lockOrientation(
    orientation
  );

  resizeReader();

}

async function lockOrientation(
  orientation
){

  if(!orientation) return;

  try{

    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      await screen.orientation.lock(
        orientation
      );

    }

  }catch(error){

    console.log(
      "Samodejno zaklepanje orientacije ni podprto.",
      error
    );

  }

}

function unlockOrientation(){

  try{

    if(
      screen.orientation &&
      screen.orientation.unlock
    ){

      screen.orientation.unlock();

    }

  }catch(e){}

}

/* ================= READER RENDER ================= */

function renderReader(){

  const comic=currentComic;

  const orientationClass=
    comic.format==="landscape"
    ? "landscape"
    : "portrait";

  app.innerHTML=`

    <div id="reader">

      <div
        class="reader-stage"
        id="reader-stage">

        <div
          class="reader-frame ${orientationClass}"
          id="reader-frame">

          <img
            id="reader-img"
            class="reader-img"
            src="${esc(
              comic.panels[currentIndex]
            )}"
            alt="${esc(comic.title)}"
            draggable="false">

        </div>

      </div>

      <div
        class="reader-top"
        id="reader-top">

        <div class="reader-row">

          <button
            type="button"
            onclick="closeReader(event)"
            aria-label="Zapri bralnik">

            ${icon("close",22)}

          </button>

          <div class="reader-title">

            ${esc(comic.title)}

          </div>

          <div
            class="counter"
            id="counter">

            ${currentIndex+1}
            /
            ${comic.panels.length}

          </div>

        </div>

        <div class="progress">

          <i
            id="reader-progress"
            style="
              width:${(
                (currentIndex+1) /
                comic.panels.length
              )*100}%;
            ">
          </i>

        </div>

      </div>

      ${
        comic.panels.length<=20
        ? `

          <div class="dots">

            ${comic.panels.map(
              (_,i)=>`

                <span
                  class="dot ${
                    i===currentIndex
                    ? "active"
                    : ""
                  }">
                </span>

              `
            ).join("")}

          </div>

        `
        :""
      }

    </div>

  `;

  resizeReader();

  setupReaderTouch();

  setupReaderWheel();

  setupMiddleMouseZoom();

  preload();

}

/* ================= RESIZE ================= */

function resizeReader(){

  const frame=
    document.getElementById(
      "reader-frame"
    );

  if(!frame) return;

  const format=
    FORMATS[
      currentComic.format
    ] || FORMATS.auto;

  if(format.ratio){

    const vw=
      window.innerWidth;

    const vh=
      window.innerHeight - 72;

    let width=vw;

    let height=
      width / format.ratio;

    if(height>vh){

      height=vh;

      width=
        height * format.ratio;

    }

    frame.style.width=
      width+"px";

    frame.style.height=
      height+"px";

  }else{

    frame.style.width=
      "100%";

    frame.style.height=
      "100%";

  }

}

/* ================= PRELOAD ================= */

function preload(){

  [-1,1].forEach(
    offset=>{

      const index=
        currentIndex+offset;

      if(
        index>=0 &&
        index<
        currentComic.panels.length
      ){

        const img=
          new Image();

        img.src=
          currentComic.panels[index];

      }

    }
  );

}

/* ================= PANELS ================= */

function nextPanel(){

  if(
    currentIndex <
    currentComic.panels.length-1
  ){

    currentIndex++;

    updateReaderImage();

  }

}

function previousPanel(){

  if(currentIndex>0){

    currentIndex--;

    updateReaderImage();

  }

}

function updateReaderImage(){

  const img=
    document.getElementById(
      "reader-img"
    );

  if(!img) return;

  img.src=
    currentComic.panels[
      currentIndex
    ];

  const counter=
    document.getElementById(
      "counter"
    );

  if(counter){

    counter.textContent=
      `${currentIndex+1} / ${currentComic.panels.length}`;

  }

  const progress=
    document.getElementById(
      "reader-progress"
    );

  if(progress){

    progress.style.width=
      `${(
        (currentIndex+1) /
        currentComic.panels.length
      )*100}%`;

  }

  document
    .querySelectorAll(".dot")
    .forEach(
      (dot,i)=>{

        dot.classList.toggle(
          "active",
          i===currentIndex
        );

      }
    );

  resetZoom();

  preload();

  if(
    currentComic.format==="auto"
  ){

    requestOrientation();

  }

}

/* ================= SWIPE ================= */

function handleSwipe(dx){

  const forward=
    currentDirection==="ltr"
    ? dx<0
    : dx>0;

  if(forward){

    nextPanel();

  }else{

    previousPanel();

  }

}

/* ================= MOUSE WHEEL ================= */

function setupReaderWheel(){

  const stage=
    document.getElementById(
      "reader-stage"
    );

  if(!stage) return;

  wheelLocked=false;

  stage.addEventListener(
    "wheel",
    e=>{

      e.preventDefault();

      if(zoomed) return;

      if(wheelLocked) return;

      if(
        Math.abs(e.deltaY)<5
      ) return;

      wheelLocked=true;

      if(e.deltaY>0){

        if(
          currentDirection==="ltr"
        ){

          nextPanel();

        }else{

          previousPanel();

        }

      }else{

        if(
          currentDirection==="ltr"
        ){

          previousPanel();

        }else{

          nextPanel();

        }

      }

      setTimeout(
        ()=>{
          wheelLocked=false;
        },
        250
      );

    },
    {
      passive:false
    }
  );

}

/* ================= MIDDLE MOUSE ZOOM ================= */

function setupMiddleMouseZoom(){

  const stage=
    document.getElementById(
      "reader-stage"
    );

  const reader=
    document.getElementById(
      "reader"
    );

  if(!stage || !reader) return;

  stage.addEventListener(
    "pointerdown",
    e=>{

      /*
        Srednji miš = button 1
      */
      if(e.button!==1) return;

      e.preventDefault();

      middleMouseDown=true;

      middleStartX=
        e.clientX;

      middleStartZoom=
        getCurrentZoom();

      reader.classList.add(
        "zoom-dragging"
      );

      try{
        stage.setPointerCapture(
          e.pointerId
        );
      }catch(err){}

    }
  );

  stage.addEventListener(
    "pointermove",
    e=>{

      if(!middleMouseDown) return;

      e.preventDefault();

      const dx=
        e.clientX-middleStartX;

      /*
        Desno = povečava
        Levo = pomanjšava

        250px premika približno
        1x dodatne povečave.
      */
      const zoom=
        middleStartZoom +
        dx/250;

      const clamped=
        Math.max(
          MIN_ZOOM,
          Math.min(
            MAX_ZOOM,
            zoom
          )
        );

      applyZoom(clamped);

    }
  );

  stage.addEventListener(
    "pointerup",
    e=>{

      if(e.button!==1) return;

      e.preventDefault();

      middleMouseDown=false;

      reader.classList.remove(
        "zoom-dragging"
      );

      try{
        stage.releasePointerCapture(
          e.pointerId
        );
      }catch(err){}

    }
  );

  stage.addEventListener(
    "pointercancel",
    e=>{

      if(!middleMouseDown) return;

      middleMouseDown=false;

      reader.classList.remove(
        "zoom-dragging"
      );

    }
  );

  /*
    Prepreči odpiranje menija brskalnika
    ob pritisku srednjega gumba.
  */
  stage.addEventListener(
    "mousedown",
    e=>{

      if(e.button===1){

        e.preventDefault();

      }

    }
  );

  stage.addEventListener(
    "auxclick",
    e=>{

      if(e.button===1){

        e.preventDefault();

      }

    }
  );

}

/* ================= ZOOM HELPERS ================= */

function getCurrentZoom(){

  const img=
    document.getElementById(
      "reader-img"
    );

  if(!img) return 1;

  if(!img.dataset.zoom){

    img.dataset.zoom="1";

  }

  const value=
    parseFloat(
      img.dataset.zoom
    );

  return Number.isFinite(value)
    ? value
    : 1;

}

function applyZoom(value){

  const img=
    document.getElementById(
      "reader-img"
    );

  if(!img) return;

  const zoom=
    Math.max(
      MIN_ZOOM,
      Math.min(
        MAX_ZOOM,
        value
      )
    );

  img.dataset.zoom=
    String(zoom);

  if(zoom<=1){

    zoomed=false;

    img.classList.remove(
      "zoomed"
    );

    img.style.transform=
      "scale(1)";

  }else{

    zoomed=true;

    img.classList.add(
      "zoomed"
    );

    img.style.transform=
      `scale(${zoom})`;

  }

}

function resetZoom(){

  zoomed=false;

  const img=
    document.getElementById(
      "reader-img"
    );

  if(img){

    img.dataset.zoom="1";

    img.classList.remove(
      "zoomed"
    );

    img.style.transform=
      "scale(1)";

    img.style.transformOrigin=
      "center";

  }

}

/* ================= TOUCH ================= */

function setupReaderTouch(){

  const stage=
    document.getElementById(
      "reader-stage"
    );

  if(!stage) return;

  let startX=0;
  let startY=0;
  let startTime=0;

  stage.addEventListener(
    "pointerdown",
    e=>{

      /*
        Srednji gumb obravnava
        ločena zoom funkcija.
      */
      if(e.button===1) return;

      startX=e.clientX;

      startY=e.clientY;

      startTime=Date.now();

    }
  );

  stage.addEventListener(
    "pointerup",
    e=>{

      /*
        Srednji gumb ne sme sprožiti
        običajnega swipe/tap vedenja.
      */
      if(e.button===1) return;

      const dx=
        e.clientX-startX;

      const dy=
        e.clientY-startY;

      const duration=
        Date.now()-startTime;

      if(
        Math.abs(dx)>50 &&
        Math.abs(dx)>
        Math.abs(dy)*1.2 &&
        duration<800 &&
        !zoomed
      ){

        handleSwipe(dx);

        return;

      }

      if(
        Math.abs(dx)<15 &&
        Math.abs(dy)<15 &&
        duration<500
      ){

        toggleReaderUI();

      }

    }
  );

  /*
    Dvoklik na telefonu/računalniku
    še vedno deluje kot zoom 2.2x.
  */
  stage.addEventListener(
    "dblclick",
    e=>{

      const img=
        document.getElementById(
          "reader-img"
        );

      if(!img) return;

      const current=
        getCurrentZoom();

      if(current>1){

        resetZoom();

      }else{

        const rect=
          img.getBoundingClientRect();

        const x=
          (
            (e.clientX-rect.left) /
            rect.width
          )*100;

        const y=
          (
            (e.clientY-rect.top) /
            rect.height
          )*100;

        img.style.transformOrigin=
          `${x}% ${y}%`;

        applyZoom(2.2);

      }

    }
  );

}

/* ================= READER UI ================= */

function toggleReaderUI(){

  readerVisible=
    !readerVisible;

  document
    .getElementById(
      "reader-top"
    )
    ?.classList.toggle(
      "hidden-ui",
      !readerVisible
    );

}

/* ================= CLOSE READER ================= */

function closeReader(event){

  if(event){

    event.preventDefault();

    event.stopPropagation();

  }

  unlockOrientation();

  document.body.classList.remove(
    "reader-active"
  );

  currentComic=null;

  middleMouseDown=false;

  renderHome();

}

/* ================= KEYBOARD ================= */

document.addEventListener(
  "keydown",
  e=>{

    if(!currentComic) return;

    if(e.key==="ArrowRight"){

      currentDirection==="ltr"
        ? nextPanel()
        : previousPanel();

    }

    if(e.key==="ArrowLeft"){

      currentDirection==="ltr"
        ? previousPanel()
        : nextPanel();

    }

    if(e.key==="Escape"){

      closeReader();

    }

  }
);

/* ================= RESIZE ================= */

window.addEventListener(
  "resize",
  ()=>{

    if(currentComic){

      resizeReader();

    }

  }
);

window.addEventListener(
  "orientationchange",
  ()=>{

    setTimeout(
      ()=>{

        if(currentComic){

          resizeReader();

        }

      },
      150
    );

  }
);

/* ================= START ================= */

async function start(){

  renderHome();

  await loadComics();

}

start();

</script>
