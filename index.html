<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GUTTER — Bralnik stripov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0E14;
    --surface:#16171F;
    --surface-2:#1D1E28;
    --gutter:#000000;
    --text:#F2EFE6;
    --muted:#9A99A6;
    --line:rgba(242,239,230,0.12);
    --line-strong:rgba(242,239,230,0.28);
    --red:#E4383F;
    --cyan:#29B6C4;
    --yellow:#F2B705;
    --radius:6px;
    --maxw:1180px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  html[data-theme='light']{
    --bg:#F2EFE6;
    --surface:#FFFFFF;
    --surface-2:#EAE6DB;
    --gutter:#D8D3C4;
    --text:#15151A;
    --muted:#6A6976;
    --line:rgba(21,21,26,0.12);
    --line-strong:rgba(21,21,26,0.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow-y:auto;
  }
  body.reader-active{ overflow:hidden; }
  h1,h2,h3{ margin:0; }
  .disp{ font-family:'Anton',sans-serif; font-weight:400; letter-spacing:0.01em; line-height:0.95; }
  button,input,select,textarea{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  a{ color:inherit; }
  .hidden{ display:none !important; }
  .view{ animation:fadeIn .18s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  :focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  /* ---------- layout shells ---------- */
  .shell{ max-width:var(--maxw); margin:0 auto; padding:0 20px 64px; }
  .topnav{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(16px + var(--safe-t)) 20px 12px; max-width:var(--maxw); margin:0 auto;
  }
  .navbtn{
    background:none; border:none; color:var(--text); display:flex; align-items:center; gap:8px;
    padding:8px; border-radius:var(--radius);
  }
  .navbtn:hover{ background:var(--line); }
  .wordmark{ font-family:'Anton',sans-serif; font-size:22px; letter-spacing:0.03em; display:flex; align-items:center; gap:8px;}
  .wordmark .mark{ display:inline-flex; gap:2px; }
  .wordmark .mark span{ width:7px; height:18px; background:var(--red); display:inline-block; }
  .wordmark .mark span:nth-child(2){ background:var(--cyan); height:14px; align-self:flex-end;}

  /* ---------- buttons / inputs ---------- */
  .btn{
    border-radius:var(--radius); padding:13px 20px; font-weight:700; font-size:15px;
    border:2px solid var(--line-strong); background:var(--surface); color:var(--text);
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
  }
  .btn:hover{ border-color:var(--text); }
  .btn-primary{ background:var(--red); border-color:var(--red); color:#fff; }
  .btn-primary:hover{ background:#c72e34; border-color:#c72e34; }
  .btn-ghost{ background:transparent; border-color:var(--line); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 14px; font-size:13px; }
  .btn-danger{ background:transparent; border-color:var(--red); color:var(--red); }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:7px; color:var(--muted); }
  .field .hint{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }
  input[type=text],input[type=search],select,textarea{
    width:100%; background:var(--surface); border:2px solid var(--line); color:var(--text);
    border-radius:var(--radius); padding:12px 14px; font-size:15px;
  }
  input:focus,select:focus,textarea:focus{ border-color:var(--cyan); }
  textarea{ min-height:130px; resize:vertical; font-family:ui-monospace,'SFMono-Regular',Menlo,monospace; font-size:13.5px; line-height:1.6; }
  .error-box{ background:rgba(228,56,63,0.12); border:2px solid var(--red); color:var(--red); padding:10px 14px; border-radius:var(--radius); font-size:14px; margin-bottom:16px; font-weight:600; }

  /* ---------- HOME ---------- */
  .hero{
    padding:36px 20px 30px; position:relative; overflow:hidden;
    background-image: radial-gradient(rgba(228,56,63,0.35) 1.4px, transparent 1.6px);
    background-size:15px 15px;
  }
  .hero-inner{ max-width:var(--maxw); margin:0 auto; }
  .hero h1{ font-size:clamp(42px,10vw,80px); }
  .hero p.tagline{ font-size:17px; color:var(--muted); max-width:420px; margin-top:14px; }
  .continue-card{
    margin-top:26px; display:flex; align-items:center; gap:14px; background:var(--surface);
    border:2px solid var(--line-strong); border-radius:var(--radius); padding:12px; max-width:460px;
  }
  .continue-card img{ width:56px; height:74px; object-fit:cover; border-radius:4px; border:2px solid var(--gutter); flex-shrink:0; }
  .continue-card .meta{ flex:1; min-width:0; }
  .continue-card .meta .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--red); font-weight:700; }
  .continue-card .meta .ttl{ font-weight:700; font-size:16px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .continue-card .meta .sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .cta-row{ display:flex; gap:12px; margin-top:24px; flex-wrap:wrap; }
  .feature-list{ margin-top:40px; display:grid; gap:14px; max-width:480px; }
  .feature-list .f{ display:flex; gap:12px; align-items:flex-start; }
  .feature-list .f .ico{ width:34px; height:34px; border-radius:4px; background:var(--surface); border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--cyan); }
  .feature-list .f .txt b{ display:block; font-size:14.5px; }
  .feature-list .f .txt span{ font-size:13px; color:var(--muted); }

  /* ---------- LIBRARY ---------- */
  .lib-head{ display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
  .search-wrap{ position:relative; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .search-wrap input{ padding-left:38px; }
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .chip{ flex-shrink:0; padding:7px 13px; border-radius:100px; border:2px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--muted); }
  .chip.active{ border-color:var(--red); color:var(--red); background:rgba(228,56,63,0.1); }

  .cr-strip{ display:flex; gap:12px; overflow-x:auto; padding:4px 2px 16px; }
  .cr-item{ flex-shrink:0; width:120px; }
  .cr-item img{ width:120px; height:120px; object-fit:cover; border-radius:4px; border:2px solid var(--line-strong); display:block; }
  .cr-item .t{ font-size:12.5px; font-weight:600; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cr-bar{ height:3px; background:var(--gutter); border-radius:2px; margin-top:5px; overflow:hidden; }
  .cr-bar i{ display:block; height:100%; background:var(--red); }

  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.09em; color:var(--muted); font-weight:700; margin:22px 0 10px; }

  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:3px; background:var(--gutter);
    padding:3px; border-radius:var(--radius); overflow:hidden;
  }
  @media(min-width:620px){ .grid{ grid-template-columns:repeat(3,1fr);} }
  @media(min-width:920px){ .grid{ grid-template-columns:repeat(4,1fr);} }
  .card{ background:var(--surface); position:relative; display:flex; flex-direction:column; }
  .card .thumb-wrap{ position:relative; aspect-ratio:3/4; overflow:hidden; background:var(--gutter); }
  .card .thumb-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card .badge{ position:absolute; top:8px; left:8px; background:rgba(13,14,20,0.82); color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:100px; }
  .card .cnt{ position:absolute; bottom:8px; right:8px; background:rgba(13,14,20,0.82); color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:100px; }
  .card .cbody{ padding:11px 12px 12px; flex:1; display:flex; flex-direction:column; }
  .card .ct{ font-weight:700; font-size:14.5px; line-height:1.25; margin-bottom:4px; }
  .card .ctags{ font-size:11.5px; color:var(--muted); margin-bottom:8px; }
  .card .progress{ height:3px; background:var(--gutter); border-radius:2px; overflow:hidden; margin-bottom:10px; }
  .card .progress i{ display:block; height:100%; background:var(--cyan); }
  .card .crow{ display:flex; gap:6px; margin-top:auto; }
  .card .crow button{ flex:1; padding:7px; border-radius:4px; border:2px solid var(--line); background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .card .crow button:hover{ border-color:var(--text); color:var(--text); }
  .card .crow .confirm{ display:flex; gap:6px; flex:1; }
  .card .crow .confirm button{ font-size:11.5px; font-weight:700; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state svg{ color:var(--line-strong); margin-bottom:14px; }
  .fab{
    position:fixed; right:calc(20px + var(--safe-r)); bottom:calc(24px + var(--safe-b)); width:56px; height:56px; border-radius:100px;
    background:var(--red); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.35); z-index:20;
  }

  /* ---------- ADD / EDIT ---------- */
  .form-wrap{ max-width:560px; }
  .fmt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .fmt-opt{ border:2px solid var(--line); border-radius:var(--radius); padding:10px; cursor:pointer; }
  .fmt-opt input{ display:none; }
  .fmt-opt .fl{ font-weight:700; font-size:13.5px; }
  .fmt-opt .fs{ font-size:11.5px; color:var(--muted); }
  .fmt-opt.sel{ border-color:var(--red); background:rgba(228,56,63,0.08); }
  .dir-row{ display:flex; gap:8px; }
  .dir-opt{ flex:1; border:2px solid var(--line); border-radius:var(--radius); padding:10px; text-align:center; cursor:pointer; }
  .dir-opt input{ display:none; }
  .dir-opt .fl{ font-weight:700; font-size:13.5px; }
  .dir-opt .fs{ font-size:11px; color:var(--muted); }
  .dir-opt.sel{ border-color:var(--cyan); background:rgba(41,182,196,0.08); }

  /* ---------- SETTINGS ---------- */
  .set-card{ background:var(--surface); border:2px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .set-card h3{ font-size:15px; margin-bottom:14px; }
  .theme-row,.dflt-dir-row{ display:flex; gap:8px; }
  .theme-opt{ flex:1; border:2px solid var(--line); border-radius:var(--radius); padding:10px; text-align:center; font-weight:700; font-size:13.5px; cursor:pointer; }
  .theme-opt.sel{ border-color:var(--yellow); color:var(--yellow); }
  .stat-row{ display:flex; gap:20px; margin-bottom:14px; }
  .stat b{ display:block; font-size:24px; font-family:'Anton',sans-serif; }
  .stat span{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .data-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---------- READER ---------- */
  #reader-view{ position:fixed; inset:0; background:#000; z-index:100; }
  .reader-stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; overflow:hidden;
  }
  .reader-frame{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .reader-frame img{ max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; transition:transform .18s ease; will-change:transform; }
  .reader-frame img.zoomed{ transition:transform .12s ease; }
  .edge-flash{ animation:edgeFlash .3s ease; }
  @keyframes edgeFlash{ 0%{ background:rgba(228,56,63,0.25);} 100%{ background:transparent; } }

  .reader-bar{
    position:absolute; left:0; right:0; z-index:5; display:flex; align-items:center; gap:12px;
    padding:12px 16px; transition:opacity .2s ease, transform .2s ease; pointer-events:auto;
  }
  .reader-bar.hidden-bar{ opacity:0; pointer-events:none; }
  #reader-topbar{ top:0; padding-top:calc(12px + var(--safe-t)); background:linear-gradient(to bottom, rgba(0,0,0,0.75), transparent); flex-direction:column; align-items:stretch; }
  .rt-row{ display:flex; align-items:center; gap:10px; color:#fff; }
  .rt-row button{ background:none; border:none; color:#fff; padding:6px; }
  .rt-title{ flex:1; min-width:0; font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rt-count{ font-size:12.5px; color:rgba(255,255,255,0.7); font-weight:600; flex-shrink:0; }
  .rt-progress{ height:2.5px; background:rgba(255,255,255,0.2); border-radius:2px; margin-top:8px; overflow:hidden; }
  .rt-progress i{ display:block; height:100%; background:var(--red); }

  #reader-bottombar{ bottom:0; padding-bottom:calc(14px + var(--safe-b)); justify-content:center; background:linear-gradient(to top, rgba(0,0,0,0.75), transparent); }
  .menu-fab{ background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.25); color:#fff; padding:10px 20px; border-radius:100px; display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; }
  .dots{ position:absolute; bottom:calc(60px + var(--safe-b)); left:0; right:0; display:flex; justify-content:center; gap:5px; z-index:5; pointer-events:none; }
  .dots span{ width:5px; height:5px; border-radius:100px; background:rgba(255,255,255,0.35); }
  .dots span.active{ background:#fff; width:14px; }

  .sheet-overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.55); z-index:6; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--surface); color:var(--text);
    border-radius:16px 16px 0 0; z-index:7; padding:10px 20px calc(20px + var(--safe-b));
    transform:translateY(100%); transition:transform .25s cubic-bezier(.32,.72,0,1); max-height:78vh; overflow-y:auto;
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--line-strong); border-radius:4px; margin:6px auto 16px; }
  .sheet h4{ font-size:12px; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); margin:16px 0 10px; }
  .sheet h4:first-of-type{ margin-top:0; }
  .sheet-fmt-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .sheet-fmt{ flex-shrink:0; border:2px solid var(--line); border-radius:8px; padding:9px 12px; font-size:12.5px; font-weight:700; }
  .sheet-fmt.active{ border-color:var(--red); color:var(--red); }
  .sheet-dir-row{ display:flex; gap:8px; }
  .sheet-dir{ flex:1; border:2px solid var(--line); border-radius:8px; padding:9px; font-size:12.5px; font-weight:700; }
  .sheet-dir.active{ border-color:var(--cyan); color:var(--cyan); }
  .sheet-comics{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .sheet-comic{ flex-shrink:0; width:86px; text-align:left; background:none; border:none; padding:0; }
  .sheet-comic img{ width:86px; height:86px; object-fit:cover; border-radius:6px; border:2px solid var(--line); }
  .sheet-comic.current img{ border-color:var(--red); }
  .sheet-comic .n{ font-size:11px; margin-top:5px; font-weight:600; line-height:1.3; }

  @media(min-width:720px){
    .cta-row .btn{ min-width:180px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var FORMATS = {
    vertical:  { label:'Navpični 9:16', sub:'Za telefon', ratio: 9/16, short:'9:16' },
    portrait:  { label:'Pokončni 3:4',  sub:'Klasični strip', ratio: 3/4, short:'3:4' },
    square:    { label:'Kvadrat 1:1',   sub:'Instagram stil', ratio: 1/1, short:'1:1' },
    landscape: { label:'Ležeči 16:9',   sub:'Široki kadri', ratio: 16/9, short:'16:9' },
    auto:      { label:'Samodejno',     sub:'Izvirno razmerje', ratio: null, short:'Auto' }
  };
  var ICONS = {
    back:'<path d="M15 18l-6-6 6-6"/>',
    close:'<path d="M18 6L6 18M6 6l12 12"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.56 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
    trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
    download:'<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',
    upload:'<path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 3h14"/>',
    swipe:'<path d="M13 5l7 7-7 7"/><path d="M20 12H4"/>',
    frame:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 15h16"/>',
    link:'<path d="M9 17H7a5 5 0 010-10h2"/><path d="M15 7h2a5 5 0 010 10h-2"/><path d="M8 12h8"/>',
    book:'<path d="M4 5a2 2 0 012-2h5v18H6a2 2 0 01-2-2z"/><path d="M20 5a2 2 0 00-2-2h-5v18h5a2 2 0 002-2z"/>',
    empty:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l4-4 4 3 5-6 5 5"/>'
  };
  function ic(name,size){ return '<svg width="'+(size||20)+'" height="'+(size||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>'; }

  var state = {
    view:'loading',
    comics:[],
    progress:{},
    settings:{ theme:'dark', defaultFormat:'vertical', defaultDirection:'ltr' },
    currentComicId:null,
    currentPanelIndex:0,
    readerUI:true,
    menuOpen:false,
    zoomed:false,
    librarySearch:'',
    libraryTagFilter:null,
    editingComicId:null,
    confirmDeleteId:null,
    confirmClear:false
  };

  /* ---------------- storage ---------------- */
  function loadJSON(key, fallback){
    return window.storage.get(key,false).then(function(res){
      if(res && res.value) return JSON.parse(res.value);
      return fallback;
    }).catch(function(){ return fallback; });
  }
  function saveJSON(key, val){
    return window.storage.set(key, JSON.stringify(val), false).catch(function(e){ console.error('shramba ni uspela', e); });
  }

  /* ---------------- helpers ---------------- */
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function genId(){ return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function normalizeImageUrl(url){
    url = url.trim();
    var m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
    if(m) return 'https://drive.google.com/uc?export=view&id=' + m[1];
    m = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
    if(m) return 'https://drive.google.com/uc?export=view&id=' + m[1];
    m = url.match(/^https?:\/\/imgur\.com\/([a-zA-Z0-9]+)\/?$/);
    if(m) return 'https://i.imgur.com/' + m[1] + '.jpg';
    return url;
  }
  function getCurrentComic(){
    for(var i=0;i<state.comics.length;i++){ if(state.comics[i].id===state.currentComicId) return state.comics[i]; }
    return null;
  }
  function getComic(id){
    for(var i=0;i<state.comics.length;i++){ if(state.comics[i].id===id) return state.comics[i]; }
    return null;
  }
  function fmtShort(comic){ var f=FORMATS[comic.format]||FORMATS.auto; return f.short; }
  function allTags(){
    var set={};
    state.comics.forEach(function(c){ (c.tags||[]).forEach(function(t){ set[t]=true; }); });
    return Object.keys(set);
  }
  function mostRecentProgress(){
    var best=null;
    Object.keys(state.progress).forEach(function(id){
      var p=state.progress[id];
      if(getComic(id) && (!best || p.updatedAt>best.updatedAt)) best=Object.assign({id:id}, p);
    });
    return best;
  }

  /* ---------------- seed demo comic (works offline, no external links needed) ---------------- */

  function seedIfEmpty(){
    if(state.comics.length>0) return;
    var demo = {
      id: genId(),
      title:'Dobrodošel v GUTTER',
      format:'vertical',
      direction:'ltr',

      createdAt: Date.now(),
      panels:[
        svgPanel('#0D0E14','#E4383F','GUTTER','Tvoj bralnik stripov','PANEL 1 / 4'),
        svgPanel('#16171F','#29B6C4','Švigni s prstom','za naslednji panel','PANEL 2 / 4'),
        svgPanel('#0D0E14','#F2B705','Dodaj svoj strip','s povezavo do slike (Imgur, Google Drive ...)','PANEL 3 / 4'),
        svgPanel('#16171F','#E4383F','Izberi format,','ki najbolje ustreza zaslonu','PANEL 4 / 4')
      ]
    };
    state.comics = [demo];
    saveJSON('comics', state.comics);

  /* ---------------- mutations ---------------- */
  function openReader(comicId, startIndex){
    var comic = getComic(comicId);
    if(!comic) return;
    state.currentComicId = comicId;
    var p = state.progress[comicId];
    state.currentPanelIndex = (typeof startIndex==='number') ? startIndex : (p ? Math.min(p.index, comic.panels.length-1) : 0);
    state.view = 'reader';
    state.readerUI = true;
    state.menuOpen = false;
    state.zoomed = false;
    render();
  }
  function deleteComic(id){
    state.comics = state.comics.filter(function(c){ return c.id!==id; });
    delete state.progress[id];
    state.confirmDeleteId = null;
    saveJSON('comics', state.comics);
    saveJSON('progress', state.progress);
    render();
  }
  function saveProgressFor(id, idx){
    state.progress[id] = { index: idx, updatedAt: Date.now() };
    saveJSON('progress', state.progress);
  }
  function exportData(){
    var data = { comics: state.comics, progress: state.progress, settings: state.settings, exportedAt: new Date().toISOString() };
    var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'gutter-knjiznica.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function importDataFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(Array.isArray(data.comics)) state.comics = data.comics;
        if(data.progress) state.progress = data.progress;
        if(data.settings) state.settings = Object.assign(state.settings, data.settings);
        saveJSON('comics', state.comics);
        saveJSON('progress', state.progress);
        saveJSON('settings', state.settings);
        state.view = 'library';
        render();
      }catch(e){
        alert('Datoteka ni veljavna JSON knjižnica GUTTER.');
      }
    };
    reader.readAsText(file);
  }
  function clearAllData(){
    state.comics = []; state.progress = {}; state.confirmClear = false;
    saveJSON('comics', []); saveJSON('progress', {});
    state.view = 'home';
    render();
  }
  function setTheme(theme){
    state.settings.theme = theme;
    saveJSON('settings', state.settings);
    document.documentElement.setAttribute('data-theme', theme);
    render();
  }

  function buildView(){
    switch(state.view){
      case 'home': return viewHome();
      case 'library': return viewLibrary();
      case 'add': return viewAddEdit();
      case 'settings': return viewSettings();
      case 'reader': return viewReader();
      default: return '<div class="view shell" style="padding-top:60px;color:var(--muted);">Nalaganje ...</div>';
    }
  }

  /* ---------------- render ---------------- */
  function render(){
    var active = document.activeElement;
    var focusId = null, selStart = null, selEnd = null;
    if(active && active.id){
      focusId = active.id;
      if('selectionStart' in active){ try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){} }
    }
    var app = document.getElementById('app');
    app.innerHTML = buildView();
    document.body.classList.toggle('reader-active', state.view==='reader');
    postRender();
    if(focusId){
      var el = document.getElementById(focusId);
      if(el){ el.focus(); if(selStart!=null){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} } }
    }
  }

  function postRender(){
    if(state.view==='library'){
      var s = document.getElementById('search-input');
      if(s) s.addEventListener('input', function(e){ state.librarySearch = e.target.value; render(); });
    }
    if(state.view==='add'){
      var form = document.getElementById('comic-form');
      if(form) form.addEventListener('submit', function(e){ e.preventDefault(); onSubmitComicForm(); });
      var fg = document.getElementById('fmt-grid');
      if(fg) fg.addEventListener('change', function(){
        Array.prototype.forEach.call(fg.querySelectorAll('.fmt-opt'), function(o){
          o.classList.toggle('sel', o.querySelector('input').checked);
        });
      });
      var dr = document.getElementById('dir-row');
      if(dr) dr.addEventListener('change', function(){
        Array.prototype.forEach.call(dr.querySelectorAll('.dir-opt'), function(o){
          o.classList.toggle('sel', o.querySelector('input').checked);
        });
      });
    }
    if(state.view==='settings'){
      var df = document.getElementById('set-default-format');
      if(df) df.addEventListener('change', function(e){ state.settings.defaultFormat = e.target.value; saveJSON('settings', state.settings); });
      var dd = document.getElementById('set-default-direction');
      if(dd) dd.addEventListener('change', function(e){ state.settings.defaultDirection = e.target.value; saveJSON('settings', state.settings); });
      var imp = document.getElementById('import-file');
      if(imp) imp.addEventListener('change', function(e){ if(e.target.files[0]) importDataFile(e.target.files[0]); });
    }
    if(state.view==='reader'){
      initReaderRuntime();
    }
  }

  function onSubmitComicForm(){
    var title = document.getElementById('field-title').value.trim();
    var format = document.querySelector('input[name=format]:checked').value;
    var direction = document.querySelector('input[name=direction]:checked').value;
    var tagsRaw = document.getElementById('field-tags').value.trim();
    var panelsRaw = document.getElementById('field-panels').value;
    var tags = tagsRaw ? tagsRaw.split(',').map(function(t){ return t.trim(); }).filter(Boolean) : [];
    var panels = panelsRaw.split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(normalizeImageUrl);
    var errorEl = document.getElementById('form-error');

    if(!title){ errorEl.textContent='Strip potrebuje naslov.'; errorEl.classList.remove('hidden'); return; }
    if(panels.length===0){ errorEl.textContent='Dodaj vsaj eno povezavo do slike panela.'; errorEl.classList.remove('hidden'); return; }
    errorEl.classList.add('hidden');

    if(state.editingComicId){
      var comic = getComic(state.editingComicId);
      comic.title=title; comic.format=format; comic.direction=direction; comic.tags=tags; comic.panels=panels;
    } else {
      state.comics.unshift({ id:genId(), title:title, format:format, direction:direction, tags:tags, panels:panels, createdAt:Date.now() });
    }
    saveJSON('comics', state.comics);
    state.editingComicId = null;
    state.view = 'library';
    render();
  }

  /* ---------------- reader runtime (targeted DOM updates for smooth swiping) ---------------- */
  function resizeStage(){
    var comic = getCurrentComic();
    var frame = document.getElementById('reader-frame');
    if(!comic || !frame) return;
    var f = FORMATS[comic.format] || FORMATS.auto;
    if(!f.ratio){ frame.style.width='100%'; frame.style.height='100%'; return; }
    var vw = window.innerWidth;
    var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    var w = vw, h = vw / f.ratio;
    if(h > vh){ h = vh; w = vh * f.ratio; }
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
  }

  function resetZoom(){
    state.zoomed = false;
    var img = document.getElementById('reader-img');
    if(img){ img.classList.remove('zoomed'); img.style.transform=''; img.style.transformOrigin=''; }
  }
  function toggleZoom(clientX, clientY){
    var img = document.getElementById('reader-img');
    if(!img) return;
    state.zoomed = !state.zoomed;
    if(state.zoomed){
      var rect = img.getBoundingClientRect();
      var ox = ((clientX-rect.left)/rect.width)*100;
      var oy = ((clientY-rect.top)/rect.height)*100;
      img.classList.add('zoomed');
      img.style.transformOrigin = ox+'% '+oy+'%';
      img.style.transform = 'scale(2.2)';
    } else {
      resetZoom();
    }
  }

  function preloadNeighbors(panels, idx){
    [idx-1, idx+1].forEach(function(i){
      if(i>=0 && i<panels.length){ var im = new Image(); im.src = panels[i]; }
    });
  }

  function flashEdge(){
    var stage = document.getElementById('reader-stage');
    if(!stage) return;
    stage.classList.remove('edge-flash');
    void stage.offsetWidth;
    stage.classList.add('edge-flash');
  }

  function updateReaderDOM(){
    var comic = getCurrentComic();
    if(!comic) return;
    var panels = comic.panels, idx = state.currentPanelIndex;
    var img = document.getElementById('reader-img');
    img.src = panels[idx];
    img.alt = comic.title + ' panel ' + (idx+1);
    resetZoom();
    var counter = document.getElementById('reader-counter');
    if(counter) counter.textContent = (idx+1) + ' / ' + panels.length;
    var fill = document.getElementById('reader-progress-fill');
    if(fill) fill.style.width = (((idx+1)/panels.length)*100) + '%';
    var dots = document.getElementById('reader-dots');
    if(dots){ Array.prototype.forEach.call(dots.children, function(d,i){ d.classList.toggle('active', i===idx); }); }
    saveProgressFor(comic.id, idx);
    preloadNeighbors(panels, idx);
  }

  function goNext(){
    var comic = getCurrentComic(); if(!comic) return;
    if(state.currentPanelIndex < comic.panels.length-1){ state.currentPanelIndex++; updateReaderDOM(); }
    else { flashEdge(); }
  }
  function goPrev(){
    var comic = getCurrentComic(); if(!comic) return;
    if(state.currentPanelIndex > 0){ state.currentPanelIndex--; updateReaderDOM(); }
    else { flashEdge(); }
  }
  function currentDirection(){
    var comic = getCurrentComic();
    return (comic && comic.direction) || state.settings.defaultDirection || 'ltr';
  }
  function handleSwipe(dx){
    var dir = currentDirection();
    var swipedLeft = dx<0;
    var forward = (dir==='ltr') ? swipedLeft : !swipedLeft;
    if(forward) goNext(); else goPrev();
  }
  function handleTapZone(rx){
    var dir = currentDirection();
    if(rx<0.32){ (dir==='ltr' ? goPrev : goNext)(); }
    else if(rx>0.68){ (dir==='ltr' ? goNext : goPrev)(); }
    else { toggleBars(); }
  }
  function toggleBars(){
    state.readerUI = !state.readerUI;
    var top = document.getElementById('reader-topbar');
    var bot = document.getElementById('reader-bottombar');
    if(top) top.classList.toggle('hidden-bar', !state.readerUI);
    if(bot) bot.classList.toggle('hidden-bar', !state.readerUI);
  }
  function openMenu(){
    state.menuOpen = true;
    var sheet = document.getElementById('reader-sheet');
    var ov = document.getElementById('sheet-overlay');
    if(sheet) sheet.classList.add('open');
    if(ov) ov.classList.add('open');
  }
  function closeMenu(){
    state.menuOpen = false;
    var sheet = document.getElementById('reader-sheet');
    var ov = document.getElementById('sheet-overlay');
    if(sheet) sheet.classList.remove('open');
    if(ov) ov.classList.remove('open');
  }
  function toggleMenu(){ state.menuOpen ? closeMenu() : openMenu(); }

  function setComicFormat(fmt){
    var comic = getCurrentComic(); if(!comic) return;
    comic.format = fmt; saveJSON('comics', state.comics);
    var row = document.getElementById('sheet-fmt-row');
    if(row) Array.prototype.forEach.call(row.children, function(b){ b.classList.toggle('active', b.getAttribute('data-format')===fmt); });
    resizeStage();
  }
  function setComicDirection(dir){
    var comic = getCurrentComic(); if(!comic) return;
    comic.direction = dir; saveJSON('comics', state.comics);
    var row = document.getElementById('sheet-dir-row');
    if(row) Array.prototype.forEach.call(row.children, function(b){ b.classList.toggle('active', b.getAttribute('data-dir')===dir); });
  }

  function initReaderRuntime(){
    resizeStage();
    var stage = document.getElementById('reader-stage');
    if(!stage) return;
    var startX=0, startY=0, startT=0, moved=false;
    var lastTapTime=0, lastTapX=0, lastTapY=0, singleTapTimer=null;

    stage.addEventListener('pointerdown', function(e){ startX=e.clientX; startY=e.clientY; startT=Date.now(); moved=false; });
    stage.addEventListener('pointermove', function(e){ if(Math.abs(e.clientX-startX)>10 || Math.abs(e.clientY-startY)>10) moved=true; });
    stage.addEventListener('pointerup', function(e){
      var dx = e.clientX-startX, dy = e.clientY-startY, dt = Date.now()-startT;
      var rect = stage.getBoundingClientRect();
      var rx = (e.clientX-rect.left)/rect.width;

      if(moved && !state.zoomed && Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3){
        handleSwipe(dx);
        return;
      }
      if(!moved && dt<500){
        var now = Date.now();
        var isDouble = (now-lastTapTime<320) && Math.abs(e.clientX-lastTapX)<40 && Math.abs(e.clientY-lastTapY)<40;
        lastTapTime = now; lastTapX = e.clientX; lastTapY = e.clientY;
        if(isDouble){
          if(singleTapTimer){ clearTimeout(singleTapTimer); singleTapTimer=null; }
          toggleZoom(e.clientX, e.clientY);
        } else {
          singleTapTimer = setTimeout(function(){
            if(state.zoomed){ toggleBars(); }
            else { handleTapZone(rx); }
            singleTapTimer = null;
          }, 300);
        }
      }
    });

    preloadNeighbors(getCurrentComic().panels, state.currentPanelIndex);
  }

  document.addEventListener('keydown', function(e){
    if(state.view!=='reader') return;
    if(e.key==='Escape'){ state.menuOpen ? closeMenu() : (state.view='library', render()); return; }
    var dir = currentDirection();
    if(e.key==='ArrowRight'){ (dir==='ltr'?goNext:goPrev)(); }
    else if(e.key==='ArrowLeft'){ (dir==='ltr'?goPrev:goNext)(); }
  });
  window.addEventListener('resize', function(){ if(state.view==='reader') resizeStage(); });
  window.addEventListener('orientationchange', function(){ if(state.view==='reader') setTimeout(resizeStage, 60); });

  /* ---------------- global click delegation ---------------- */
  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');
    switch(action){
      case 'go-home': state.view='home'; render(); break;
      case 'go-library': state.view='library'; render(); break;
      case 'go-settings': state.view='settings'; render(); break;
      case 'go-add': state.editingComicId=null; state.view='add'; render(); break;
      case 'edit-comic': state.editingComicId=id; state.view='add'; render(); break;
      case 'open-comic': openReader(id); break;
      case 'continue-comic': openReader(id); break;
      case 'delete-comic-request': state.confirmDeleteId=id; render(); break;
      case 'delete-comic-cancel': state.confirmDeleteId=null; render(); break;
      case 'delete-comic-confirm': deleteComic(id); break;
      case 'reader-exit': state.view='library'; render(); break;
      case 'reader-menu-toggle': toggleMenu(); break;
      case 'reader-menu-close': closeMenu(); break;
      case 'reader-switch-comic': closeMenu(); openReader(id); break;
      case 'reader-format': setComicFormat(el.getAttribute('data-format')); break;
      case 'reader-direction': setComicDirection(el.getAttribute('data-dir')); break;
      case 'tag-filter': state.libraryTagFilter = (el.getAttribute('data-tag')==='__all__') ? null : el.getAttribute('data-tag'); render(); break;
      case 'export-data': exportData(); break;
      case 'clear-data-request': state.confirmClear=true; render(); break;
      case 'clear-data-confirm': clearAllData(); break;
      case 'clear-data-cancel': state.confirmClear=false; render(); break;
      case 'theme-set': setTheme(el.getAttribute('data-theme')); break;
    }
  });

  /* ---------------- init ---------------- */
  function init(){
    Promise.all([
      loadJSON('comics', []),
      loadJSON('progress', {}),
      loadJSON('settings', {})
    ]).then(function(results){
      state.comics = results[0];
      state.progress = results[1];
      state.settings = Object.assign({theme:'dark', defaultFormat:'vertical', defaultDirection:'ltr'}, results[2]);
      document.documentElement.setAttribute('data-theme', state.settings.theme);
      seedIfEmpty();
      state.view = 'home';
      render();
    });
  }
  init();
})();
</script>
</body>
