<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GUTTER — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
    }

    header {
      padding: 20px;
      background: #1b1b1b;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header a {
      color: #ddd;
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 25px;
    }

    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      color: #bbb;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #101010;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #888;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      font-family: monospace;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      margin-top: 15px;
      background: #eee;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.85;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button-row button {
      flex: 0 0 auto;
    }

    .success {
      background: #315f3a;
      color: white;
    }

    .danger {
      background: #a83232;
      color: white;
    }

    .secondary {
      background: #333;
      color: white;
    }

    .connection {
      background: #244b2d;
      color: #d8ffe0;
      border: 1px solid #397747;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #101010;
      border: 1px solid #333;
      display: none;
      line-height: 1.5;
    }

    .status.ok {
      border-color: #397747;
      background: #152418;
    }

    .status.error {
      border-color: #7b3333;
      background: #241515;
    }

    .comic {
      border: 1px solid #333;
      background: #121212;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
    }

    .comic-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .comic-info {
      color: #aaa;
      font-size: 13px;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    .small {
      color: #888;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .connection-box {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #101010;
      border: 1px solid #333;
      font-size: 14px;
    }

    .green {
      color: #72d982;
    }

    .red {
      color: #ff7777;
    }

    .yellow {
      color: #e6cf70;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      header {
        padding: 15px;
        flex-direction: column;
        align-items: flex-start;
      }

      .button-row {
        flex-direction: column;
      }

      .button-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>GUTTER — Admin</h1>

  <a href="index.html">
    ← Nazaj na GUTTER
  </a>

</header>


<div class="container">


  <!-- =========================================================
       GITHUB NASTAVITVE
       ========================================================= -->

  <div class="card">

    <h2>⚙️ GitHub nastavitve</h2>

    <label for="owner">
      GitHub uporabnik
    </label>

    <input
      id="owner"
      type="text"
      placeholder="npr. mojuporabnik"
    >

    <label for="repo">
      Ime repozitorija
    </label>

    <input
      id="repo"
      type="text"
      placeholder="npr. gutter"
    >

    <label for="token">
      GitHub token
    </label>

    <input
      id="token"
      type="password"
      placeholder="GitHub Personal Access Token"
    >

    <div class="button-row">

      <button
        type="button"
        class="success"
        onclick="saveSettings()"
      >
        💾 Shrani nastavitve
      </button>

      <button
        type="button"
        class="connection"
        onclick="testConnection()"
      >
        🔌 Preveri povezavo
      </button>

      <button
        type="button"
        class="secondary"
        onclick="clearSettings()"
      >
        🗑️ Izbriši nastavitve
      </button>

    </div>

    <div
      id="connectionStatus"
      class="connection-box"
    >
      ⚪ Povezava še ni preverjena.
    </div>

    <div class="small">

      Nastavitve se shranijo samo v ta brskalnik
      na tej napravi.

      Token se ne zapisuje v comics.json.

    </div>

  </div>


  <!-- =========================================================
       ADMIN PANEL
       ========================================================= -->

  <div
    id="adminPanel"
    class="hidden"
  >

    <div class="card">

      <h2>📚 Upravljanje stripov</h2>

      <div class="button-row">

        <button
          type="button"
          onclick="loadComics()"
        >
          🔄 Osveži stripe
        </button>

        <button
          type="button"
          class="secondary"
          onclick="newComic()"
        >
          ➕ Nov strip
        </button>

        <button
          type="button"
          class="danger"
          onclick="logout()"
        >
          🚪 Zapri admin
        </button>

      </div>

      <div
        id="status"
        class="status"
      ></div>

    </div>


    <!-- =======================================================
         OBRAZEC ZA STRIP
         ======================================================= -->

    <div class="card">

      <h2>📝 Strip</h2>

      <label for="comicId">
        ID stripa
      </label>

      <input
        id="comicId"
        type="text"
        placeholder="npr. strip-001"
      >

      <label for="comicTitle">
        Naslov
      </label>

      <input
        id="comicTitle"
        type="text"
        placeholder="Naslov stripa"
      >

      <label for="comicFormat">
        Format
      </label>

      <select id="comicFormat">

        <option value="auto">
          Samodejno
        </option>

        <option value="vertical">
          Vertikalni 9:16
        </option>

        <option value="portrait">
          Pokončni 3:4
        </option>

        <option value="square">
          Kvadratni 1:1
        </option>

        <option value="landscape">
          Ležeči 16:9
        </option>

      </select>

      <label for="comicDirection">
        Smer branja
      </label>

      <select id="comicDirection">

        <option value="ltr">
          Levo → desno
        </option>

        <option value="rtl">
          Desno → levo
        </option>

      </select>

      <label for="comicTags">
        Oznake
      </label>

      <input
        id="comicTags"
        type="text"
        placeholder="akcija, fantazija, humor"
      >

      <label for="comicPanels">
        URL povezave do slik
      </label>

      <textarea
        id="comicPanels"
        placeholder="https://moja-stran.si/slika1.jpg
https://moja-stran.si/slika2.jpg
https://moja-stran.si/slika3.jpg"
      ></textarea>

      <div class="small">

        Vsako sliko vpiši v svojo vrstico.

      </div>

      <div class="button-row">

        <button
          type="button"
          class="success"
          onclick="saveComic()"
        >
          💾 Shrani strip
        </button>

        <button
          type="button"
          class="secondary"
          onclick="newComic()"
        >
          🧹 Počisti obrazec
        </button>

      </div>

    </div>


    <!-- =======================================================
         SEZNAM STRIPOV
         ======================================================= -->

    <div class="card">

      <h2>📖 Objavljeni stripi</h2>

      <div id="comicList">
        Nalagam...
      </div>

    </div>

  </div>

</div>


<script>

/* ============================================================
   GUTTER ADMIN
   ============================================================ */

let comics = [];
let editingId = null;


/* ============================================================
   GITHUB NASTAVITVE
   ============================================================ */

function getGitHubSettings() {

  return {
    owner: document.getElementById("owner").value.trim(),
    repo: document.getElementById("repo").value.trim(),
    token: document.getElementById("token").value.trim()
  };

}


function saveSettings() {

  const settings = getGitHubSettings();


  if (!settings.owner) {

    alert("Vpiši GitHub uporabnika.");

    return;

  }


  if (!settings.repo) {

    alert("Vpiši ime repozitorija.");

    return;

  }


  if (!settings.token) {

    alert("Vpiši GitHub token.");

    return;

  }


  localStorage.setItem(
    "gutter_admin_owner",
    settings.owner
  );


  localStorage.setItem(
    "gutter_admin_repo",
    settings.repo
  );


  localStorage.setItem(
    "gutter_admin_token",
    settings.token
  );


  setConnectionStatus(
    "🟡 Nastavitve so shranjene. Zdaj preveri povezavo.",
    "yellow"
  );


  showAdminPanel();

}


function loadSettings() {

  const owner =
    localStorage.getItem("gutter_admin_owner");

  const repo =
    localStorage.getItem("gutter_admin_repo");

  const token =
    localStorage.getItem("gutter_admin_token");


  if (owner) {

    document.getElementById("owner").value =
      owner;

  }


  if (repo) {

    document.getElementById("repo").value =
      repo;

  }


  if (token) {

    document.getElementById("token").value =
      token;


    setConnectionStatus(
      "🟡 Shranjene nastavitve so naložene. Klikni »Preveri povezavo«.",
      "yellow"
    );


    showAdminPanel();

  }

}


function clearSettings() {

  const answer =
    confirm(
      "Ali res želiš izbrisati shranjene GitHub nastavitve?"
    );


  if (!answer) {
    return;
  }


  localStorage.removeItem(
    "gutter_admin_owner"
  );


  localStorage.removeItem(
    "gutter_admin_repo"
  );


  localStorage.removeItem(
    "gutter_admin_token"
  );


  document.getElementById("owner").value = "";
  document.getElementById("repo").value = "";
  document.getElementById("token").value = "";


  document
    .getElementById("adminPanel")
    .classList.add("hidden");


  setConnectionStatus(
    "⚪ Shranjene nastavitve so izbrisane.",
    ""
  );

}


/* ============================================================
   STATUS
   ============================================================ */

function setConnectionStatus(
  message,
  type
) {

  const box =
    document.getElementById(
      "connectionStatus"
    );


  box.textContent =
    message;


  box.className =
    "connection-box";


  if (type === "ok") {

    box.classList.add("green");

  }


  if (type === "error") {

    box.classList.add("red");

  }


  if (type === "yellow") {

    box.classList.add("yellow");

  }

}


function showStatus(
  message,
  error = false
) {

  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "block";


  status.textContent =
    message;


  status.className =
    error
      ? "status error"
      : "status ok";

}


/* ============================================================
   ADMIN PANEL
   ============================================================ */

function showAdminPanel() {

  const settings =
    getGitHubSettings();


  if (
    settings.owner &&
    settings.repo &&
    settings.token
  ) {

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");

  }

}


/* ============================================================
   GITHUB REQUEST
   ============================================================ */

async function githubRequest(
  method,
  url,
  body = null
) {

  const settings =
    getGitHubSettings();


  const headers = {

    "Accept":
      "application/vnd.github+json",

    "Authorization":
      "Bearer " + settings.token,

    "X-GitHub-Api-Version":
      "2022-11-28"

  };


  const options = {

    method:
      method,

    headers:
      headers

  };


  if (body !== null) {

    options.headers["Content-Type"] =
      "application/json";


    options.body =
      JSON.stringify(body);

  }


  const response =
    await fetch(
      url,
      options
    );


  if (!response.ok) {

    let message =
      "GitHub napaka.";


    try {

      const data =
        await response.json();


      if (data.message) {

        message =
          data.message;

      }

    } catch (e) {}


    throw new Error(
      message +
      " (" +
      response.status +
      ")"
    );

  }


  return response.json();

}


/* ============================================================
   PREVERI POVEZAVO
   ============================================================ */

async function testConnection() {

  const settings =
    getGitHubSettings();


  if (
    !settings.owner ||
    !settings.repo ||
    !settings.token
  ) {

    setConnectionStatus(
      "🔴 Manjkajo GitHub uporabnik, repozitorij ali token.",
      "error"
    );

    return;

  }


  setConnectionStatus(
    "⏳ Preverjam povezavo z GitHubom...",
    "yellow"
  );


  try {

    const url =
      "https://api.github.com/repos/" +
      encodeURIComponent(settings.owner) +
      "/" +
      encodeURIComponent(settings.repo);


    const data =
      await githubRequest(
        "GET",
        url
      );


    setConnectionStatus(
      "🟢 Povezava deluje! Repozitorij: " +
      data.full_name +
      " | veja: " +
      data.default_branch,
      "ok"
    );


    showAdminPanel();


    await loadComics();


  } catch (error) {

    setConnectionStatus(
      "🔴 Povezava ni uspela: " +
      error.message,
      "error"
    );

  }

}


/* ============================================================
   PREBERI comics.json
   ============================================================ */

async function getComicsFile() {

  const settings =
    getGitHubSettings();


  const url =
    "https://api.github.com/repos/" +
    encodeURIComponent(settings.owner) +
    "/" +
    encodeURIComponent(settings.repo) +
    "/contents/comics.json";


  const data =
    await githubRequest(
      "GET",
      url
    );


  const binary =
    atob(
      data.content.replace(/\n/g, "")
    );


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);

  }


  const text =
    new TextDecoder(
      "utf-8"
    ).decode(
      bytes
    );


  let parsedComics = [];


  try {

    parsedComics =
      JSON.parse(
        text || "[]"
      );

  } catch (error) {

    throw new Error(
      "comics.json ni veljaven JSON."
    );

  }


  return {

    sha:
      data.sha,

    comics:
      Array.isArray(parsedComics)
        ? parsedComics
        : []

  };

}


/* ============================================================
   SHRANI comics.json NA GITHUB
   ============================================================ */

async function saveComicsToGithub(
  comicsData,
  sha
) {

  const settings =
    getGitHubSettings();


  /*
     Pridobimo privzeto vejo repozitorija.
  */

  const repoUrl =
    "https://api.github.com/repos/" +
    encodeURIComponent(settings.owner) +
    "/" +
    encodeURIComponent(settings.repo);


  const repoData =
    await githubRequest(
      "GET",
      repoUrl
    );


  const branch =
    repoData.default_branch;


  /*
     Pretvori JSON v UTF-8 Base64.
  */

  const json =
    JSON.stringify(
      comicsData,
      null,
      2
    );


  const bytes =
    new TextEncoder()
      .encode(json);


  let binary =
    "";


  bytes.forEach(
    function(byte) {

      binary +=
        String.fromCharCode(byte);

    }
  );


  const base64 =
    btoa(binary);


  /*
     GitHub Contents API.
  */

  const url =
    "https://api.github.com/repos/" +
    encodeURIComponent(settings.owner) +
    "/" +
    encodeURIComponent(settings.repo) +
    "/contents/comics.json";


  const body = {

    message:
      "Update comics.json",

    content:
      base64,

    sha:
      sha,

    branch:
      branch

  };


  return githubRequest(
    "PUT",
    url,
    body
  );

}


/* ============================================================
   NALOŽI STRIPE
   ============================================================ */

async function loadComics() {

  try {

    showStatus(
      "⏳ Nalagam stripe..."
    );


    const data =
      await getComicsFile();


    comics =
      Array.isArray(data.comics)
        ? data.comics
        : [];


    renderComics();


    showStatus(
      "✅ Stripe so uspešno naloženi."
    );


  } catch (error) {

    showStatus(
      "❌ Napaka pri nalaganju: " +
      error.message,
      true
    );

  }

}


/* ============================================================
   PRIKAŽI STRIPE
   ============================================================ */

function renderComics() {

  const container =
    document.getElementById(
      "comicList"
    );


  if (!comics.length) {

    container.innerHTML =
      "<p>Trenutno ni nobenega stripa.</p>";

    return;

  }


  container.innerHTML =
    "";


  comics.forEach(
    function(comic) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "comic";


      const tags =
        Array.isArray(comic.tags)
          ? comic.tags.join(", ")
          : "";


      const panels =
        Array.isArray(comic.panels)
          ? comic.panels.length
          : 0;


      div.innerHTML = `

        <div class="comic-title">

          ${escapeHtml(
            comic.title ||
            "Brez naslova"
          )}

        </div>


        <div class="comic-info">

          ID:
          ${escapeHtml(
            comic.id || ""
          )}

          <br>

          Format:
          ${escapeHtml(
            comic.format ||
            "auto"
          )}

          <br>

          Smer:
          ${escapeHtml(
            comic.direction ||
            "ltr"
          )}

          <br>

          Oznake:
          ${escapeHtml(
            tags
          )}

          <br>

          Število slik:
          ${panels}

        </div>


        <div class="button-row">

          <button
            type="button"
            onclick="editComic('${escapeJs(comic.id)}')"
          >
            ✏️ Uredi
          </button>


          <button
            type="button"
            class="danger"
            onclick="deleteComic('${escapeJs(comic.id)}')"
          >
            🗑️ Izbriši
          </button>

        </div>

      `;


      container.appendChild(
        div
      );

    }
  );

}


/* ============================================================
   NOV STRIP
   ============================================================ */

function newComic() {

  editingId =
    null;


  document.getElementById(
    "comicId"
  ).value =
    "";


  document.getElementById(
    "comicTitle"
  ).value =
    "";


  document.getElementById(
    "comicFormat"
  ).value =
    "auto";


  document.getElementById(
    "comicDirection"
  ).value =
    "ltr";


  document.getElementById(
    "comicTags"
  ).value =
    "";


  document.getElementById(
    "comicPanels"
  ).value =
    "";


  document.getElementById(
    "comicId"
  ).focus();

}


/* ============================================================
   UREDI STRIP
   ============================================================ */

function editComic(id) {

  const comic =
    comics.find(
      function(item) {

        return String(item.id) ===
          String(id);

      }
    );


  if (!comic) {

    alert(
      "Strip ni bil najden."
    );

    return;

  }


  editingId =
    comic.id;


  document.getElementById(
    "comicId"
  ).value =
    comic.id || "";


  document.getElementById(
    "comicTitle"
  ).value =
    comic.title || "";


  document.getElementById(
    "comicFormat"
  ).value =
    comic.format || "auto";


  document.getElementById(
    "comicDirection"
  ).value =
    comic.direction || "ltr";


  document.getElementById(
    "comicTags"
  ).value =
    Array.isArray(comic.tags)
      ? comic.tags.join(", ")
      : "";


  document.getElementById(
    "comicPanels"
  ).value =
    Array.isArray(comic.panels)
      ? comic.panels.join("\n")
      : "";


  window.scrollTo({

    top: 0,

    behavior:
      "smooth"

  });

}


/* ============================================================
   SHRANI STRIP
   ============================================================ */

async function saveComic() {

  const id =
    document.getElementById(
      "comicId"
    ).value.trim();


  const title =
    document.getElementById(
      "comicTitle"
    ).value.trim();


  const format =
    document.getElementById(
      "comicFormat"
    ).value;


  const direction =
    document.getElementById(
      "comicDirection"
    ).value;


  const tagsText =
    document.getElementById(
      "comicTags"
    ).value.trim();


  const panelsText =
    document.getElementById(
      "comicPanels"
    ).value.trim();


  if (!id) {

    alert(
      "Vpiši ID stripa."
    );

    return;

  }


  if (!title) {

    alert(
      "Vpiši naslov stripa."
    );

    return;

  }


  if (!panelsText) {

    alert(
      "Vpiši vsaj eno povezavo do slike."
    );

    return;

  }


  const tags =
    tagsText
      ? tagsText
          .split(",")
          .map(
            function(tag) {

              return tag.trim();

            }
          )
          .filter(Boolean)

      : [];


  const panels =
    panelsText
      .split("\n")
      .map(
        function(url) {

          return url.trim();

        }
      )
      .filter(Boolean);


  const comic = {

    id:
      id,

    title:
      title,

    format:
      format,

    direction:
      direction,

    tags:
      tags,

    panels:
      panels

  };


  try {

    showStatus(
      "⏳ Shranjujem strip..."
    );


    const data =
      await getComicsFile();


    comics =
      Array.isArray(data.comics)
        ? data.comics
        : [];


    if (
      editingId !== null
    ) {

      const index =
        comics.findIndex(
          function(item) {

            return String(item.id) ===
              String(editingId);

          }
        );


      if (index !== -1) {

        comics[index] =
          comic;

      } else {

        comics.push(
          comic
        );

      }

    } else {

      const exists =
        comics.some(
          function(item) {

            return String(item.id) ===
              String(id);

          }
        );


      if (exists) {

        alert(
          "Ta ID že obstaja. Uporabi drug ID ali uredi obstoječi strip."
        );

        return;

      }


      comics.push(
        comic
      );

    }


    await saveComicsToGithub(
      comics,
      data.sha
    );


    editingId =
      null;


    await loadComics();


    newComic();


    showStatus(
      "✅ Strip je uspešno shranjen na GitHub."
    );


  } catch (error) {

    showStatus(
      "❌ Napaka pri shranjevanju: " +
      error.message,
      true
    );

  }

}


/* ============================================================
   IZBRIŠI STRIP
   ============================================================ */

async function deleteComic(id) {

  const comic =
    comics.find(
      function(item) {

        return String(item.id) ===
          String(id);

      }
    );


  if (!comic) {
    return;
  }


  const answer =
    confirm(
      'Ali res želiš izbrisati strip "' +
      comic.title +
      '"?'
    );


  if (!answer) {
    return;
  }


  try {

    showStatus(
      "⏳ Brišem strip..."
    );


    const data =
      await getComicsFile();


    comics =
      data.comics.filter(
        function(item) {

          return String(item.id) !==
            String(id);

        }
      );


    await saveComicsToGithub(
      comics,
      data.sha
    );


    await loadComics();


    showStatus(
      "✅ Strip je izbrisan."
    );


  } catch (error) {

    showStatus(
      "❌ Napaka pri brisanju: " +
      error.message,
      true
    );

  }

}

/* ============================================================
   ZAŠČITA IZPISA
   ============================================================ */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJs(value) {

  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}
